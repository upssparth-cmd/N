name: Build Neuromores Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: |
          unzip -q Neuromores_Android_Project.zip -d extracted
          find extracted -maxdepth 3 -type f | head -50
      - name: Build debug APK
        run: gradle -p extracted/NeuromoresAndroid :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Neuromores-Android-APK
          path: extracted/NeuromoresAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
