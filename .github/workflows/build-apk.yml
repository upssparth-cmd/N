name: Build Neuromores Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -q Neuromores_Android_Project.zip -d extracted
      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/NeuromoresAndroid/app/build.gradle.kts")
          s = p.read_text()
          marker = "android {"
          if marker not in s:
              raise SystemExit("Could not find android { in " + str(p))
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(marker, marker + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """, 1)
          p.write_text(s)
          print("Updated Java compile target to 17")
          PY
      - name: Build debug APK
        run: gradle -p extracted/NeuromoresAndroid :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Neuromores-Android-APK
          path: extracted/NeuromoresAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
